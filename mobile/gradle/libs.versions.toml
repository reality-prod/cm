# SPDX-License-Identifier: AGPL-3.0-or-later
# TODO(verify-versions): bump on first sync.
[versions]
agp = "8.13.0"
kotlin = "2.0.21"
compose = "1.7.3"
activityCompose = "1.9.3"
ktor = "3.0.1"
coil = "3.0.4"
secretService = "1.3.3"  # Added this version

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-biometric = { module = "androidx.biometric:biometric", version = "1.1.0" }
androidx-fragment = { module = "androidx.fragment:fragment", version = "1.8.5" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.9.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.3" }
jetbrains-markdown = { module = "org.jetbrains:markdown", version = "0.7.3" } # Apache-2.0; TODO(verify-version)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" } # Added open-source Linux HTTP engine
linux-secret-service = { group = "org.purejava", name = "secret-service", version.ref = "secretService" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
