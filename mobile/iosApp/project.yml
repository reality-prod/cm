# Generate the Xcode project on a Mac:  brew install xcodegen && cd iosApp && xcodegen   (or: make ios)
name: iosApp
options:
  bundleIdPrefix: org.codeberg
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [iosApp]   # includes iOSApp.swift and PrivacyInfo.xcprivacy
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: "Codeberg"
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "Unlock Codeberg with Face ID."
        # codebergmobile://codeberg.org/owner/repo[/issues/N]  (validated by the shared parseDeepLink)
        CFBundleURLTypes:
          - CFBundleURLName: org.codeberg.mobile
            CFBundleURLSchemes: [codebergmobile]
        # Declarative SPKI pinning (iOS 14+): a connection to codeberg.org must contain one of these Let's Encrypt
        # CAs. Same pins as androidApp/src/main/res/xml/network_security_config.xml (see tools/print-pins.sh).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSPinnedDomains:
            codeberg.org:
              NSIncludesSubdomains: true
              NSPinnedCAIdentities:
                # BEGIN GENERATED PINS (tools/sync.py from certs/pins.json)
                - SPKI-SHA256-BASE64: "sCkq5UWXjg+7mKu9lMhhYF5bGLsy7VI/UNW3tccdR7w="  # Root YE
                - SPKI-SHA256-BASE64: "fk6IOKit1ild5647BH06ujSIq5XbCgqlbYl6ANhhi88="  # Root YR
                - SPKI-SHA256-BASE64: "diGVwiVYbubAI3RW4hB9xU8e/CH2GnkuvVFZE8zmgzI="  # ISRG Root X2
                - SPKI-SHA256-BASE64: "C5+lpZ7tcVwmwQIMcRtPbsQtWLABXhQzejna0wHFr8M="  # ISRG Root X1
                - SPKI-SHA256-BASE64: "brzvtCELCIZUo4sD/qPX0ccRtPsd3DY6RfmxpOU9oB4="  # YE1
                - SPKI-SHA256-BASE64: "s/tdAOmUzd8syaTuqfgGvFcn6DzA5Cmb+Vby1ST+U3Y="  # YE2
                - SPKI-SHA256-BASE64: "ppiiCCS+BOR6GjPE+kiHMb6SAR8jox6QDiyibJwqz84="  # YE3
                - SPKI-SHA256-BASE64: "LoMHBotttiDko50Gi13uXW71eIy7LAttI+rYT8wXF4w="  # YR1
                - SPKI-SHA256-BASE64: "nWN7PSep5XDQdge5zK24CnCRXHr3KvzhKEGxsdqCX9E="  # YR2
                - SPKI-SHA256-BASE64: "UaqofZhLVZrGnpKfiIoCLYMuCJ/026CkErUQG8pLx5k="  # YR3
                # END GENERATED PINS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.codeberg.yourusername.codebergmobile
        PRODUCT_NAME: CodebergMobile
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Build Kotlin framework
        script: 'cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode'
