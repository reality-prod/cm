app-id: org.codeberg.Mobile
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: codeberg-mobile

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets

modules:
  - name: codeberg-mobile
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib
      - cp -r bin/* /app/bin/
      - cp -r lib/* /app/lib/
    sources:
      - type: dir
        path: mobile/linuxMobileApp/build/compose/binaries/main/app/codeberg-mobile
