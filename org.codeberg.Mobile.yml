app-id: org.codeberg.Mobile
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: 

finish-args:
  # Wayland (Phosh, Plasma Mobile) + X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Hardware acceleration for Compose/Skiko rendering
  - --device=dri
  # Codeberg API access
  - --share=network
  # Freedesktop Secret Service / Flatpak Secret Portal for credential storage
  - --talk-name=org.freedesktop.secrets

modules:
  - name: codeberg-mobile
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib
      - cp -r bin/* /app/bin/
      - cp -r lib/* /app/lib/
    sources:
      - type: dir
        path: mobile/linuxMobileApp/build/compose/binaries/main/app/<AppName>

