# Codeberg CI (Woodpecker). NOT YET RUN ON CODEBERG.
# Checks that generated files match their sources. The Android and iOS builds need the Android SDK and macOS,
# so they are separate pipelines to add when a suitable runner exists.
when:
  event: [push, pull_request]

steps:
  generated-files:
    image: python:3.12-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq openssl >/dev/null
      - make check
